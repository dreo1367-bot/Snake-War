name: "Build Windows EXE"
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: "Test network logic"
        run: dotnet run -c Release --project tests/NetTestLib
      - name: "Publish single-file EXE"
        run: dotnet publish P2PChat/P2PChat.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-out
      - name: "Zip"
        shell: pwsh
        run: Compress-Archive -Path publish-out/P2PChat.exe -DestinationPath P2PChat-win-x64.zip -Force
      - name: "Create release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v1.0-chat --title "P2P Chat EXE" --notes "Скачай P2PChat.exe, запусти на обоих ПК в одной сети - соединение автоматическое" P2PChat-win-x64.exe=publish-out/P2PChat.exe P2PChat-win-x64.zip || gh release upload v1.0-chat P2PChat-win-x64.exe=publish-out/P2PChat.exe P2PChat-win-x64.zip --clobber
