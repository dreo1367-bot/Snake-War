name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # нужно для создания Release (gh release create)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file EXE (self-contained)
        run: dotnet publish BallGame/BallGame.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish-out

      - name: Zip
        run: Compress-Archive -Path publish-out/BallGame.exe -DestinationPath BallGame-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BallGame-exe
          path: |
            publish-out/BallGame.exe
            BallGame-win-x64.zip

      - name: Create GitHub Release (через gh CLI, permissions: contents: write)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0-build-" + $env:GITHUB_RUN_NUMBER
          gh release create $tag --target $env:GITHUB_SHA --title "BallGame EXE ($tag)" --notes "2D игра «Весёлый Мяч» на C#. Скачайте BallGame.exe (или zip), запустите на Windows x64 — ничего устанавливать не нужно." publish-out/BallGame.exe BallGame-win-x64.zip
        shell: pwsh
